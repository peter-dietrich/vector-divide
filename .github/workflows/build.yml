name: Vector Divide macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone engine
        run: bash scripts/test_engine.sh
      - name: Build native game
        run: xcodebuild -project VectorDivide.xcodeproj -scheme VectorDivide -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
